<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WeApRous Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="chat-container">
            <header class="app-header">
                <h1>WeApRous Chat</h1>
                <p class="subtitle">Secure P2P Communication</p>
            </header>

            <div id="setup" class="card">
                <div class="card-header">
                    <h2>⚙️ Profile Setup</h2>
                </div>
                
                <div class="grid-row">
                    <div class="form-group">
                        <label for="myIp">Your IP</label> 
                        <input id="myIp" placeholder="e.g. 192.168.1.20"> 
                    </div>
                    <div class="form-group">
                        <label for="username">Your Name</label>
                        <input id="username" value="guest" placeholder="Enter name">
                    </div>
                    <div class="form-group">
                        <label for="port">Port</label>
                        <input id="port" value="9001" placeholder="Port">
                    </div>
                </div>
                <button id="btnRegister" class="btn-primary">Connect to Tracker</button>
            </div>

            <div id="peers" class="card">
                <div class="card-header">
                    <h2>👥 Select Peer</h2>
                </div>
                <div class="peer-container">
                    <select id="peerSelect" class="peer-select" disabled>
                        <option value="">Waiting for connection...</option>
                    </select>
                </div>
            </div>

            <div id="chat" class="card chat-card">
                <div class="card-header">
                    <h2>💬 Conversation</h2>
                </div>
                
                <div id="messages">
                    <div class="empty-state">Ready to chat</div>
                </div>
                
                <div class="message-input-area">
                    <input id="messageInput" placeholder="Type a message..." disabled autocomplete="off">
                    <button id="btnSend" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
