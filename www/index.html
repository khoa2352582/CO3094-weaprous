<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WeApRous Chat</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="chat-container">
        <h1>WeApRous Chat</h1>

        <div id="setup">
            <h2>Profile Setup</h2>
            <div class="form-group">
                <label for="username">Your name:</label>
                <input id="username" value="guest" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="port">Your port:</label>
                <input id="port" value="9001" placeholder="Enter your port">
            </div>
            <button id="btnRegister">Register with Tracker</button>
        </div>

        <div id="peers">
            <h2>Select Peer</h2>
            <div class="peer-container">
                <select id="peerSelect" class="peer-select" disabled>
                    <option value="">Select a peer to chat with...</option>
                </select>
            </div>
        </div>

        <div id="chat">
            <h2>P2P Messages</h2>
            <div id="messages"></div>
            <div class="message-input">
                <input id="messageInput" placeholder="Type your message here..." disabled>
                <button id="btnSend" disabled>Send Message</button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
